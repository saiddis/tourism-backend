services:
  tourism-backend:
    build:
      context: .
    container_name: tourism-backend
    image: tourism-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 8080:8080
    networks:
      - tourism-network
    depends_on:
      - tourism-postgres

  tourism-postgres:
    image: postgres:17
    container_name: tourism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./migrations/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tourism-network

volumes:
  postgres-data:

networks:
  tourism-network:
    name: tourism-network
    external: true
